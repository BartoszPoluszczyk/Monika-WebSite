{% load static %}
<nav class="site-navbar" aria-label="Nawigacja główna">
    <div class="site-container navbar-inner">
        <a class="brand" href="{% url 'home' %}" aria-label="Monika Kulik — strona główna">
            {% if site_settings and site_settings.logo %}
                <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}" class="navbar-logo">
            {% else %}
                <img
                    src="{% static 'images/branding/monika-kulik-logo-pionowe.svg' %}"
                    alt="Monika Kulik — dietetyk kliniczny, strona główna"
                    class="navbar-logo navbar-logo-default"
                    width="529"
                    height="651"
                >
            {% endif %}
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Otwórz menu"
        >
            <span></span><span></span>
        </button>

        <div class="collapse navbar-collapse custom-navigation" id="mainNavigation">
            <div class="navigation-links">
                <a class="navigation-link{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Strona główna</span>
                </a>
                <a class="navigation-link{% if request.resolver_match.url_name == 'about' %} is-active{% endif %}" href="{% url 'home' %}#o-mnie" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6"/></svg><span>O mnie</span>
                </a>
                <a class="navigation-link" href="{% url 'home' %}#pomoc">
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V10"/><path d="M12 14C7 14 5 10 5 5c5 0 7 3 7 9Z"/><path d="M12 17c0-5 2-8 7-9 0 5-2 9-7 9Z"/></svg><span>Jak pomagam</span>
                </a>
                <a class="navigation-link" href="{% url 'home' %}#oferta">
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg><span>Oferta</span>
                </a>
                <a class="navigation-link" href="{% url 'home' %}#wspolpraca">
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.3"/><path d="M3.5 20c.5-4 2.5-6 5.5-6s5 2 5.5 6M14 20c.2-2.5 1.4-4.1 3.7-4.7 1.8.6 2.8 2.2 3 4.7"/></svg><span>Współpraca</span>
                </a>
                <a class="navigation-link{% if request.resolver_match.url_name == 'calorie_calculator' %} is-active{% endif %}" href="{% url 'calorie_calculator' %}" {% if request.resolver_match.url_name == 'calorie_calculator' %}aria-current="page"{% endif %}>
                    <svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 7h8M8 12h2m4 0h2M8 16h2m4 0h2"/></svg><span>Kalkulator kalorii</span>
                </a>
            </div>

            <div class="navbar-signature" aria-hidden="true">
                <div class="navbar-signature-copy">
                    <span>Zdrowie zaczyna się</span>
                    <strong>od dobrych wyborów</strong>
                </div>
            </div>

            <a class="navbar-cta" href="{% url 'booking:book' %}">Umów wizytę <span aria-hidden="true">→</span></a>
        </div>
    </div>
</nav>
